name: artemis
version: 7.14.0

description: Build dart types from GraphQL schemas and queries (using Introspection Query).
homepage: https://github.com/comigor/artemis

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  build_config: ^1.1.1
  code_builder: ^4.10.0
  build: ^4.0.0
  collection: ^1.17.1
  dart_style: ^3.0.0
  equatable: ^2.0.5
  glob: ^2.1.1
  gql_code_builder: '^0.15.0'
  gql_dedupe_link: ^2.0.3+1
  gql_exec: '>=0.4.3 <2.0.0'
  gql_http_link: '>=0.4.5 <2.0.0'
  gql_link: '>=0.5.0 <2.0.0'
  gql: '>=0.14.0 <2.0.0'
  http: '>=0.13.5 <2.0.0'
  json_annotation: ^4.9.0
  path: ^1.8.3
  recase: ^4.1.0
  source_gen: ^4.0.0
  yaml: ^3.1.1

dev_dependencies:
  args: ^2.4.0
  build_runner: ^2.10.0
  build_test: ^3.0.0
  json_serializable: ^6.11.0
  test: ^1.31.0
  logging: ^1.1.1
  lints: ^6.0.0
